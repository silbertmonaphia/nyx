name: CI

on:
  push:
    branches: [ main, mvp ]
  pull_request:
    branches: [ main, mvp ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nyx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/nyx_test?sslmode=disable
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.1'
        cache-dependency-path: backend/go.sum
    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
    - name: Run golangci-lint
      run: |
        cd backend
        golangci-lint run --timeout=5m
    - name: Test
      run: cd backend && go test -v ./...

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install dependencies
      run: cd frontend && npm install
    - name: Test
      run: cd frontend && npm test

  e2e-test:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nyx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: "postgres://postgres:postgres@localhost:5432/nyx?sslmode=disable"
      JWT_SECRET: "ci-secret"
      PORT: "8080"
      GIN_MODE: "release"
      REDIS_ENABLED: "false"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.1'
        cache-dependency-path: backend/go.sum
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install Backend deps
      run: cd backend && go mod vendor
    - name: Build backend
      run: cd backend && go build -o /tmp/nyx-api ./cmd/api
    - name: Install Frontend deps
      run: cd frontend && npm install
    - name: Install Playwright Browsers
      run: cd frontend && npx playwright install --with-deps chromium
    - name: Run E2E Tests
      run: |
        set -euo pipefail

        cleanup() {
          if [ -f /tmp/nyx-api.pid ]; then
            local pid
            pid=$(cat /tmp/nyx-api.pid)
            if kill -0 "$pid" 2>/dev/null; then
              echo "Stopping backend pid=$pid"
              kill -TERM "$pid" 2>/dev/null || true
              for _ in {1..10}; do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "$pid" 2>/dev/null || true
            fi
          fi
        }
        trap cleanup EXIT

        # CWD = backend so migrations resolve file://migrations
        cd backend
        /tmp/nyx-api > /tmp/nyx-api.log 2>&1 &
        echo $! > /tmp/nyx-api.pid
        cd ..

        # Readiness: HTTP 200 AND services.database == "up"
        for i in {1..60}; do
          body=$(curl -fsS http://localhost:8080/api/health 2>/dev/null || true)
          if echo "$body" | grep -q '"database":"up"'; then
            echo "Backend ready after ${i}s"
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "Backend did not become ready in 60s"
            echo "--- /tmp/nyx-api.log (tail) ---"
            tail -n 200 /tmp/nyx-api.log || true
            exit 1
          fi
          sleep 1
        done

        # Playwright auto-starts Vite via frontend/playwright.config.ts webServer block
        cd frontend
        set +e
        npm run test:e2e
        test_exit=$?
        set -e
        exit $test_exit
    - name: Upload Playwright HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 14
    - name: Upload Playwright test artifacts (traces, videos)
      if: failure() || cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: frontend/test-results/
        retention-days: 14
