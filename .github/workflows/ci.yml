# SECURITY.md L11: all third-party actions are pinned to a commit SHA,
# not a mutable tag like @v4 / @v5. A tag can be re-pointed by the
# upstream maintainer (or by an attacker who compromises the
# upstream) to a different commit; a SHA is immutable. Bumping a
# SHA is a deliberate code review step (look up the new SHA on the
# upstream release page, update the comment + the version comment
# below).
#
# Pinning policy (kept in sync with this file's `actions:` lines):
#   actions/checkout@v4.6.2       → ea165f8d65b6e75b540449e92b4886f43607fa02
#   actions/setup-go@v5.6.0       → 40f1582b2485089dde7abd97c1529aa768e1baff
#   actions/setup-node@v4.4.0     → 49933ea5288caeca8642d1e84afbd3f7d6820020
#   actions/upload-artifact@v4.4. → 11d5960a326750d5838078e36cf38b85af677262
# (last entry truncated for readability; SHAs match the comment
# block below each `uses:` line)
name: CI

on:
  push:
    branches: [ main, mvp ]
  pull_request:
    branches: [ main, mvp ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nyx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/nyx_test?sslmode=disable
    steps:
    - uses: actions/checkout@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26.1'
        cache-dependency-path: backend/go.sum
    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
    - name: Run golangci-lint
      run: |
        cd backend
        golangci-lint run --timeout=5m
    - name: Install sqlc
      run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
    - name: Verify sqlc generated code is up to date
      working-directory: backend
      run: make sqlc-diff
    - name: Verify committed OpenAPI spec is up to date
      working-directory: backend
      run: make openapi-diff
    - name: Test
      run: cd backend && go test -v ./...

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: cd frontend && npm ci
    - name: Lint
      run: cd frontend && npm run lint
    - name: Test
      run: cd frontend && npm test
    - name: Build
      run: cd frontend && npm run build

  e2e-test:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nyx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: "postgres://postgres:postgres@localhost:5432/nyx?sslmode=disable"
      JWT_SECRET: "ci-secret"
      PORT: "8080"
      REDIS_ENABLED: "false"
    steps:
    - uses: actions/checkout@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26.1'
        cache-dependency-path: backend/go.sum
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install Backend deps
      run: cd backend && go mod vendor
    - name: Build backend
      run: cd backend && go build -o /tmp/nyx-api ./cmd/api
    - name: Install Frontend deps
      run: cd frontend && npm install
    - name: Install Playwright Browsers
      run: cd frontend && npx playwright install --with-deps chromium
    - name: Run E2E Tests
      run: |
        set -euo pipefail

        cleanup() {
          if [ -f /tmp/nyx-api.pid ]; then
            local pid
            pid=$(cat /tmp/nyx-api.pid)
            if kill -0 "$pid" 2>/dev/null; then
              echo "Stopping backend pid=$pid"
              kill -TERM "$pid" 2>/dev/null || true
              for _ in {1..10}; do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "$pid" 2>/dev/null || true
            fi
          fi
        }
        trap cleanup EXIT

        # CWD = backend so migrations resolve file://migrations
        cd backend
        /tmp/nyx-api > /tmp/nyx-api.log 2>&1 &
        echo $! > /tmp/nyx-api.pid
        cd ..

        # Readiness: HTTP 200 AND services.database == "up"
        for i in {1..60}; do
          body=$(curl -fsS http://localhost:8080/api/health 2>/dev/null || true)
          if echo "$body" | grep -q '"database":"up"'; then
            echo "Backend ready after ${i}s"
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "Backend did not become ready in 60s"
            echo "--- /tmp/nyx-api.log (tail) ---"
            tail -n 200 /tmp/nyx-api.log || true
            exit 1
          fi
          sleep 1
        done

        # Playwright auto-starts Vite via frontend/playwright.config.ts webServer block
        cd frontend
        set +e
        npm run test:e2e
        test_exit=$?
        set -e
        exit $test_exit
    - name: Upload Playwright HTML report
      if: always()
      uses: actions/upload-artifact@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 14
    - name: Upload Playwright test artifacts (traces, videos)
      if: failure() || cancelled()
      uses: actions/upload-artifact@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        name: playwright-test-results
        path: frontend/test-results/
        retention-days: 14

  # Release job — only runs on push (not on PRs), and only after CI
  # is green. Drives semantic-release which:
  #   - analyzes Conventional Commits since the last tag per package
  #   - computes the next semver for backend / frontend independently
  #   - writes per-package CHANGELOG.md (backend/CHANGELOG.md,
  #     frontend/CHANGELOG.md)
  #   - stamps the new version into ServiceVersion + frontend/package.json
  #     via scripts/bump-version.sh
  #   - tags (e.g. backend@0.4.1) and publishes GitHub Releases
  release:
    needs: [e2e-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mvp')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # push tags + release commits
      issues: write     # semantic-release mentions PRs in release notes
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # semantic-release needs full history
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: 'github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: 'github-actions[bot]@users.noreply.github.com'
        run: npx semantic-release