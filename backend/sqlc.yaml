    gen:
      go:
        package: "db"
        out: "internal/feed/db"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: false
        emit_prepared_queries: false
        emit_empty_slices: true
        rename:
          id: "ID"
          user_id: "UserID"
          created_at: "CreatedAt"
          updated_at: "UpdatedAt"
          deleted_at: "DeletedAt"
