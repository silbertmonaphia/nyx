[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-agent"
version = "0.1.0"
description = "Nyx Plan-and-Execute agent orchestrator (LangGraph + Pydantic)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2",
    # The planner's structured-output path (`response_format` json_schema
    # bind + Pydantic-validated content parsing, see
    # openspec/changes/agent-planner-structured) is developed and verified
    # against the 1.x line; the floor is conservative rather than
    # exhaustively bisected.
    "langchain-openai>=0.3",
    "langgraph-checkpoint-postgres>=3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0",
    "redis>=5.2",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "prometheus-client>=0.21",
    "httpx>=0.27",
    # Direct use in observability.py: a trust_env=False session for the
    # OTLP exporter so span export bypasses HTTP_PROXY. Also a transitive
    # dep of opentelemetry-exporter-otlp-proto-http; declared here because
    # we import it directly.
    "requests>=2.32",
    # LLM-level tracing export (agent-langfuse-tracing). The Python SDK's
    # version line is independent of the self-hosted platform's (compose
    # runs langfuse 4.58.0; PyPI's `langfuse` package is currently 4.17.x).
    # Bounded below 5 because observability.py depends on 4.x SDK semantics:
    # the singleton client via `get_client()` and the
    # `langfuse.langchain.CallbackHandler` import path.
    "langfuse>=4.17,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "vcrpy>=6.0",
    "testcontainers[postgres]>=4.8",
    # Lint / type tooling (task 9.3, agent-planner-structured).
    # Run: `.venv/bin/ruff check .` and `.venv/bin/mypy agent`.
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]