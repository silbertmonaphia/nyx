version: '3.8'

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nyx_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nyx_password}
      - POSTGRES_DB=${POSTGRES_DB:-nyx_db}
    # No ports exposed to the public in production
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - nyx_network

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - nyx_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
    restart: always
    environment:
      - DB_URL=postgres://${POSTGRES_USER:-nyx_user}:${POSTGRES_PASSWORD:-nyx_password}@db:5432/${POSTGRES_DB:-nyx_db}?sslmode=disable
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - CACHE_TTL=${CACHE_TTL:-5m}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nyx_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api}
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nyx_network

networks:
  nyx_network:
    driver: bridge

volumes:
  db_data:
  redis_data: