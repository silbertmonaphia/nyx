version: '3.8'

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nyx_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nyx_password}
      - POSTGRES_DB=${POSTGRES_DB:-nyx_db}
    # No ports exposed to the public in production
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - nyx_network

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - nyx_network

  # OpenTelemetry tracing — Jaeger v1.62+ ingests OTLP/HTTP directly
  # (no sidecar collector needed). Internal-only in prod: the nginx
  # proxy inside the frontend container is the only ingress, so we
  # don't expose :16686 / :4318 to the host. healthcheck uses the
  # admin port (14269) so backend/frontend can wait for it.
  jaeger:
    image: jaegertracing/all-in-one:1.62
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/status"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nyx_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
    restart: always
    environment:
      - DB_URL=postgres://${POSTGRES_USER:-nyx_user}:${POSTGRES_PASSWORD:-nyx_password}@db:5432/${POSTGRES_DB:-nyx_db}?sslmode=disable
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - CACHE_TTL=${CACHE_TTL:-5m}
      # OpenTelemetry — on by default so spans flow into the local
      # Jaeger UI through the frontend's nginx same-origin proxy.
      # Override OTEL_ENABLED=false in .env to disable.
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=nyx-backend
      # Cross-origin XHR — the SPA hits the backend at a different
      # origin in production. The browser triggers a CORS preflight;
      # this allowlist gates cross-origin XHR (no ACAC — Bearer is a
      # plain Authorization header).
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://app.nyx.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - nyx_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Split origin: SPA at https://app.nyx.com, API at
        # https://api.nyx.com. Override these via .env per
        # environment (staging / preview / etc.).
        - VITE_API_URL=${VITE_API_URL:-https://api.nyx.com/api}
        - API_ORIGIN=${API_ORIGIN:-https://api.nyx.com}
        # OpenTelemetry — VITE_* vars are baked into the bundle at
        # build time. JAEGER_HOST is read at runtime by nginx to
        # proxy /otlp/ → JAEGER_HOST:4318 (same-origin, no CORS).
        - VITE_OTEL_ENABLED=${VITE_OTEL_ENABLED:-true}
        - VITE_OTEL_SERVICE_NAME=${VITE_OTEL_SERVICE_NAME:-nyx-frontend}
    ports:
      - "80:80"
    environment:
      - VITE_OTEL_ENABLED=${VITE_OTEL_ENABLED:-true}
      - VITE_OTEL_SERVICE_NAME=${VITE_OTEL_SERVICE_NAME:-nyx-frontend}
      - JAEGER_HOST=jaeger
      - API_ORIGIN=${API_ORIGIN:-https://api.nyx.com}
    depends_on:
      backend:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - nyx_network

networks:
  nyx_network:
    driver: bridge

volumes:
  db_data:
  redis_data: