services:
  db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # SECURITY.md H12: dev DB is bound to loopback only — exposing the
    # default `postgres/postgres` credentials on the LAN is a free
    # admin cred. Developers who need LAN access can flip this back
    # to "5433:5432" temporarily, but the safe default is 127.0.0.1.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # SECURITY.md M12: drop all caps by default, then add back only
    # what postgres needs to run as a non-root user inside the
    # container (CHOWN the data dir, SETUID/SETGID to drop to the
    # `postgres` user, DAC_OVERRIDE/FOWNER for the postmaster pid
    # file + socket). no-new-privileges blocks setuid binaries.
    # read_only is intentionally NOT set — postgres writes to the
    # data volume.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    # SECURITY.md H12: same reasoning as the DB — loopback only.
    ports:
      - "127.0.0.1:6379:6379"
    # SECURITY.md M12: redis is intentionally read-only rootfs
    # because no persistence is enabled (no --save, no AOF). tmpfs
    # gives /data a scratch space for runtime bookkeeping. caps
    # trimmed to the bare minimum.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # OpenTelemetry tracing — Jaeger v1.62+ ingests OTLP/HTTP directly
  # (no sidecar collector needed). COLLECTOR_OTLP_ENABLED turns the
  # OTLP receiver on; the default UI lives on :16686 and the OTLP
  # HTTP receiver on :4318. healthcheck uses the admin port (14269)
  # so backend can wait for it via depends_on.
  # SECURITY.md M12: minimal hardening — jaeger all-in-one is a Go
  # binary that needs almost nothing. We keep the dev ports (16686
  # UI, 4318 OTLP) bound on 0.0.0.0 because they're meant for host
  # access; only DB/Redis got loopback-bound (H12).
  jaeger:
    image: jaegertracing/all-in-one:1.62
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI (dev-only access — see H12 comment)
      - "4318:4318"   # OTLP HTTP (dev-only access — see H12 comment)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/status"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
    ports:
      - "8080:8080"
    # env_file makes .env loading independent of the shell's CWD —
    # compose always reads the file next to this compose file.
    env_file:
      - .env
    environment:
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - CACHE_TTL=${CACHE_TTL:-5m}
      - JWT_SECRET=${JWT_SECRET}
      # OpenTelemetry — on by default in compose so spans flow into
      # the local Jaeger UI without extra env-var setup. Override
      # OTEL_ENABLED=false in .env to disable.
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-nyx-backend}
      # Cross-origin XHR — the SPA now hits the backend directly via
      # VITE_API_URL=http://localhost:8080/api. The browser opens
      # a CORS preflight; the backend's CORS_ALLOWED_ORIGINS allowlist
      # gates cross-origin XHR. Bearer is a custom header, so the
      # preflight carries Access-Control-Request-Headers:
      # Authorization, and the allowlist closes the CSRF surface
      # automatically.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      # Self-hosted LLM (optional). Off by default — `docker compose up`
      # boots the existing stack untouched. Operators opt in via
      # `--profile vllm` (see the `vllm` service below). When the
      # profile is active, LLM_BASE_URL points at the vLLM container
      # on the default bridge network, LLM_ALLOW_PRIVATE_URL=true is
      # required (the container hostname resolves to a private IP),
      # and LLM_PROVIDER=vllm selects the new raw-HTTP client
      # implemented in backend/internal/llm/vllm/. LLM_API_KEY is
      # intentionally empty — vLLM started without --api-key accepts
      # any Authorization header, including none.
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-vllm}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://vllm:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      - LLM_ALLOW_PRIVATE_URL=${LLM_ALLOW_PRIVATE_URL:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      vllm:
        condition: service_healthy
        required: false
    # SECURITY.md M12: backend Dockerfile already sets USER nyx
    # (non-root), so no compose-level user: override is needed.
    # Read-only rootfs; tmpfs gives /tmp the writable scratch Go
    # runtime expects (e.g. cgo build cache, race detector temp
    # files). All caps dropped; backend doesn't need any.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./frontend
      args:
        # Cross-origin: the SPA hits the backend on :8080 directly.
        # The browser triggers CORS preflight; see the backend's
        # CORS_ALLOWED_ORIGINS env above. No more /api/ same-origin
        # proxy — Bearer is a regular Authorization header that
        # doesn't need cookie-style same-origin semantics.
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api}
        # API_ORIGIN feeds the CSP connect-src directive via the
        # __API_ORIGIN__ placeholder in nginx.conf.
        - API_ORIGIN=${API_ORIGIN:-http://localhost:8080}
        # OpenTelemetry — the frontend Dockerfile bakes VITE_OTEL_ENABLED
        # and VITE_OTEL_SERVICE_NAME into the bundle at build time.
        # JAEGER_HOST is read at runtime by nginx to proxy /otlp/ to the
        # Jaeger OTLP/HTTP receiver (same-origin, no CORS).
        - VITE_OTEL_ENABLED=${VITE_OTEL_ENABLED:-true}
        - VITE_OTEL_SERVICE_NAME=${VITE_OTEL_SERVICE_NAME:-nyx-frontend}
    environment:
      - VITE_OTEL_ENABLED=${VITE_OTEL_ENABLED:-true}
      - VITE_OTEL_SERVICE_NAME=${VITE_OTEL_SERVICE_NAME:-nyx-frontend}
      - JAEGER_HOST=jaeger
      - API_ORIGIN=${API_ORIGIN:-http://localhost:8080}
    # nginx runs as non-root (USER nginx in Dockerfile) so it can't bind
    # privileged port 80. The nginx.conf inside the container listens on 8080.
    ports:
      - "5173:8080"
    depends_on:
      - backend
      - jaeger
    # SECURITY.md M12: frontend Dockerfile already sets USER nginx
    # (non-root), so no compose-level user: override. Read-only
    # rootfs with tmpfs mounts for nginx's writable scratch dirs
    # (cache, pid file, /run). All caps dropped — nginx in this
    # image only needs to listen on a non-privileged port (8080)
    # and proxy_pass to jaeger/backend.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /run

  # Self-hosted vLLM (opt-in profile). Operators bring this up with
  # `docker compose --profile vllm up`. When inactive, the rest of
  # the stack boots untouched and the backend's LLM_ENABLED=false
  # path skips constructing any provider client.
  #
  # Image is pinned — vLLM publishes a new minor every few weeks
  # and a bump can change error JSON shape, default flags, or the
  # stream framing. Bump deliberately.
  #
  # Cold start: Qwen2.5-3B-Instruct loads in ~30-90s on CPU and
  # 10-30s on GPU. The 120s start_period on the healthcheck is
  # generous for a 3B model — operators pointing at a larger model
  # should raise it accordingly.
  #
  # GPU: deploy.resources.reservations.devices requests one
  # NVIDIA device. On a host without the NVIDIA container runtime
  # this is silently ignored and vLLM boots in CPU mode (slow but
  # functional for smoke tests).
  #
  # Caching: the named vllm_cache volume persists HuggingFace
  # downloads across `compose down` so a 2 GB model weight doesn't
  # re-pull every restart. HUGGING_FACE_HUB_TOKEN is optional —
  # only needed for gated models (Llama, Mistral). The default
  # Qwen2.5-3B-Instruct is Apache-2.0 and ungated.
  vllm:
    image: vllm/vllm-openai:v0.6.3.post1
    profiles: ["vllm"]
    restart: always
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}"
      - "--served-model-name"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    ports:
      # Loopback only — vLLM is reached by the backend container
      # on the compose network, never from the host directly.
      # SECURITY.md H12: same pattern as db / redis.
      - "127.0.0.1:8000:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # /v1/models returns the list of loaded models — cheapest
      # "server is up AND at least one model is loaded" probe.
      # curl is in the vllm image; older revisions had only wget.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp

volumes:
  db_data:
  vllm_cache:
