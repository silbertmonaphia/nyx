services:
  db:
    image: postgres:17-alpine
    # Local-dev resource caps. Generous enough that the dev stack
    # stays healthy on a 16 GB laptop; tight enough to prevent a
    # runaway query from starving the host. Override per-run with
    # `docker compose up -d --scale <svc>=1 -m 2g <svc>`.
    mem_limit: 1g
    cpus: "1.00"
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # SECURITY.md H12: dev DB is bound to loopback only — exposing the
    # default `postgres/postgres` credentials on the LAN is a free
    # admin cred. Developers who need LAN access can flip this back
    # to "5433:5432" temporarily, but the safe default is 127.0.0.1.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # SECURITY.md M12: drop all caps by default, then add back only
    # what postgres needs to run as a non-root user inside the
    # container (CHOWN the data dir, SETUID/SETGID to drop to the
    # `postgres` user, DAC_OVERRIDE/FOWNER for the postmaster pid
    # file + socket). no-new-privileges blocks setuid binaries.
    # read_only is intentionally NOT set — postgres writes to the
    # data volume.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    mem_limit: 256m
    cpus: "0.50"
    restart: always
    # SECURITY.md H12: same reasoning as the DB — loopback only.
    # Host port 6380 (not the default 6379) so this doesn't collide
    # with a native redis-server installed on the developer host.
    ports:
      - "127.0.0.1:6380:6379"
    # SECURITY.md M12: redis is intentionally read-only rootfs
    # because no persistence is enabled (no --save, no AOF). tmpfs
    # gives /data a scratch space for runtime bookkeeping. caps
    # trimmed to the bare minimum.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # OpenTelemetry tracing — Jaeger v2 (single OTel Collector binary,
  # image `jaegertracing/jaeger`). The default config enables the OTLP
  # receivers (4317 gRPC / 4318 HTTP) and the `healthcheckv2`
  # extension on :13133/status; no `--set` flags needed.
  # SECURITY.md M12: minimal hardening — Jaeger v2 is a Go binary
  # that needs almost nothing. We keep the dev ports (16686 UI, 4318
  # OTLP) bound on 0.0.0.0 because they're meant for host access; only
  # DB/Redis got loopback-bound (H12).
  jaeger:
    image: jaegertracing/jaeger:2.18.0
    mem_limit: 512m
    cpus: "0.50"
    restart: always
    ports:
      - "16686:16686" # UI (dev-only access — see H12 comment)
      - "4318:4318"   # OTLP HTTP (used by backend & SPA via compose network)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/status"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # Opt-in profile. Default `docker compose up` boots only the
    # infra services (db / redis / jaeger); backend + frontend run
    # locally via `cd backend && go run ./cmd/api` + `cd frontend &&
    # npm run dev`. Use `--profile app` (alone or with `--profile
    # vllm`) to bring the application containers up via compose.
    profiles: ["app"]
    build:
      context: ./backend
      # GOPROXY is only relevant at build time. It lives in
      # `backend/.env.example` for the local dev workflow; compose
      # doesn't read that file for build-arg substitution, so the
      # default below is what always lands in the Dockerfile ARG.
      # Operators needing a custom proxy: set GOPROXY in the shell
      # before `docker compose build`, or override here directly.
      args:
        - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
    mem_limit: 512m
    cpus: "1.00"
    ports:
      - "8080:8080"
    # Runtime config is fully sourced from `backend/.env` — every
    # var listed in `backend/.env.example` (JWT_SECRET, DB_URL,
    # CORS_ALLOWED_ORIGINS, REDIS_*, OTEL_*, LLM_*, etc.) flows
    # through here. No `environment:` block on purpose: compose's
    # `environment:` takes precedence over `env_file`, so leaving
    # any literal here would lock operators out of overriding that
    # var via `backend/.env`. Compose-specific defaults that differ
    # from viper's defaults (e.g. REDIS_ENABLED, OTEL_ENABLED,
    # LLM_PROVIDER, LLM_BASE_URL) are uncommented in
    # `backend/.env.example`; copy + edit to opt in.
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      vllm:
        condition: service_healthy
        required: false
    # SECURITY.md M12: backend Dockerfile already sets USER nyx
    # (non-root), so no compose-level user: override is needed.
    # Read-only rootfs; tmpfs gives /tmp the writable scratch Go
    # runtime expects (e.g. cgo build cache, race detector temp
    # files). All caps dropped; backend doesn't need any.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    # See `backend` above — both app containers sit behind the
    # `app` profile so the default `docker compose up` only stands
    # up infra (db / redis / jaeger).
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        # Cross-origin: the SPA hits the backend on :8080 directly.
        # The browser triggers CORS preflight; see the backend's
        # CORS_ALLOWED_ORIGINS env above. No more /api/ same-origin
        # proxy — Bearer is a regular Authorization header that
        # doesn't need cookie-style same-origin semantics.
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api}
        # API_ORIGIN feeds the CSP connect-src directive via the
        # __API_ORIGIN__ placeholder in nginx.conf.
        - API_ORIGIN=${API_ORIGIN:-http://localhost:8080}
        # OpenTelemetry — the frontend Dockerfile bakes VITE_OTEL_ENABLED
        # and VITE_OTEL_SERVICE_NAME into the bundle at build time.
        # JAEGER_HOST is read at runtime by nginx to proxy /otlp/ to the
        # Jaeger OTLP/HTTP receiver (same-origin, no CORS).
        - VITE_OTEL_ENABLED=${VITE_OTEL_ENABLED:-true}
        - VITE_OTEL_SERVICE_NAME=${VITE_OTEL_SERVICE_NAME:-nyx-frontend}
        # Sentry — VITE_SENTRY_DSN is inlined into the SPA bundle.
        # SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT are build-time
        # only (consumed by @sentry/vite-plugin for sourcemap upload).
        # Default the token to empty so local builds without a Sentry
        # account still succeed — the plugin only registers when all
        # three are set. SENTRY_CSP_ORIGIN feeds the CSP connect-src
        # directive via the __SENTRY_CSP_ORIGIN__ placeholder; default
        # is the SaaS ingest host list — self-hosted operators override.
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
        - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN:-}
        - SENTRY_ORG=${SENTRY_ORG:-}
        - SENTRY_PROJECT=${SENTRY_PROJECT:-nyx-frontend}
        - SENTRY_CSP_ORIGIN=${SENTRY_CSP_ORIGIN:-https://*.ingest.sentry.io https://*.sentry.io}
    mem_limit: 128m
    cpus: "0.25"
    # Runtime env comes from `frontend/.env`. Compose's build-arg
    # substitution above doesn't read this file, so VITE_* baked
    # into the SPA bundle is controlled by shell env at build time
    # (12-factor); see `frontend/.env.example` for the mapping.
    env_file:
      - frontend/.env
    # JAEGER_HOST is the only compose-specific runtime literal —
    # the in-network hostname for the Jaeger container. Don't move
    # it into `frontend/.env.example` because `jaeger` only resolves
    # on the compose bridge; local dev runs against localhost.
    environment:
      - JAEGER_HOST=jaeger
    # nginx runs as non-root (USER nginx in Dockerfile) so it can't bind
    # privileged port 80. The nginx.conf inside the container listens on 8080.
    ports:
      - "5173:8080"
    depends_on:
      - backend
      - jaeger
    # SECURITY.md M12: frontend Dockerfile already sets USER nginx
    # (non-root), so no compose-level user: override. Read-only
    # rootfs with tmpfs mounts for nginx's writable scratch dirs
    # (cache, pid file, /run). All caps dropped — nginx in this
    # image only needs to listen on a non-privileged port (8080)
    # and proxy_pass to jaeger/backend.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:mode=0777
      - /var/run:mode=0777
      - /run:mode=0777

  # Self-hosted vLLM (opt-in profile). Operators bring this up with
  # `docker compose --profile vllm up`. When inactive, the rest of
  # the stack boots untouched and the backend's LLM_ENABLED=false
  # path skips constructing any provider client.
  #
  # Image is pinned — vLLM publishes a new minor every few weeks
  # and a bump can change error JSON shape, default flags, or the
  # stream framing. Bump deliberately.
  #
  # Cold start: Qwen3-4B-Instruct-2507 takes ~30s on GPU after weight
  # download when --enforce-eager is set (default here); without it,
  # vLLM's V2 Model Runner captures cudagraphs for batch sizes
  # 1..max-cuda-graph-bs (default 512) and cold start balloons to
  # ~10-15 min on first run because each capture round-trips through
  # the WSL2 GPU-PV DXGI shim. The 600s start_period + 600s of
  # healthcheck retries covers both with ~5 min headroom. Operators
  # who need the latency win can drop --enforce-eager; the bootstrap
  # script waits up to 25 min for the longer cold path.
  #
  # GPU: deploy.resources.reservations.devices requests one
  # NVIDIA device. On a host without the NVIDIA container runtime
  # this is silently ignored and vLLM boots in CPU mode (slow but
  # functional for smoke tests).
  #
  # Caching: the named vllm_cache volume persists HuggingFace
  # downloads across `compose down` so a 2 GB model weight doesn't
  # re-pull every restart. HUGGING_FACE_HUB_TOKEN is REQUIRED —
  # HF's CAS endpoint (cas-server.xethub.hf.co) demands a token
  # for all weight downloads, even ungated models like the default
  # Qwen3-4B-Instruct-2507. Without it model load aborts with an
  # auth error. Generate at https://huggingface.co/settings/tokens
  # (read role is enough).
  vllm:
    image: vllm/vllm-openai:v0.29.0
    # vLLM is the only realistic runaway on a dev host — model
    # weights (~8 GB for Qwen3-4B in bf16) + KV cache + activations
    # scale with context length. 16 GB / 4 CPU is a safe floor on a
    # 32 GB laptop with `--enforce-eager`. Bump if you run longer
    # contexts, larger models, or drop --enforce-eager.
    mem_limit: 16g
    cpus: "4.00"
    profiles: ["vllm"]
    restart: always
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}"
      - "--served-model-name"
      - "${VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      # --enforce-eager skips cudagraph capture: sub-30s cold start
      # at the cost of ~10-30% per-token latency on small batches.
      # Comment out to re-enable cudagraphs once you measure the hit.
      - "--enforce-eager"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      # HF_ENDPOINT routes HuggingFace API calls (config + weight fetches)
      # through a mirror. Default https://hf-mirror.com because upstream
      # https://huggingface.co is often filtered / unreachable from the
      # Docker-bridge egress path even when the host can reach it (WSL2
      # vpnkit NAT, corporate firewalls). Mirror covers Qwen / Llama /
      # Mistra / etc. — override to empty in .env to use upstream.
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      # Skip IPv6 retries: HF resolves to AAAA on most networks, but v6
      # routing to the upstream is frequently broken even when v4 works.
      # Without this, vLLM burns its 5-retry budget on doomed v6 SYN
      # attempts before falling back to v4 — model download then aborts
      # with ENETUNREACH.
      - HF_HUB_DISABLE_IPV6=${HF_HUB_DISABLE_IPV6:-1}
      # WSL2 with GPU-PV (driver exposes CUDA via libcuda.so in
      # /usr/lib/wsl/lib, no /dev/nvidia*). vLLM disables pinned memory
      # / UVA by default on WSL2 due to a small perf regression, but the
      # v1 engine's staged-writes UvaBuffer requires UVA and aborts
      # otherwise ("RuntimeError: UVA is not available" from
      # vllm/v1/worker/gpu/buffer_utils.py). Set to 1 to enable. The
      # flag's comment in vllm/envs.py scopes it to "CPU offloading or
      # v2 model runner" but in practice it's also required by the v1
      # staged-writes buffer on WSL2. NOTE: VLLM_USE_V1=0 is NOT a
      # fallback — the V0 engine was removed in vLLM 0.9 and the var
      # is no longer in envs.py on the 0.29.0 image we pin.
      - VLLM_WSL2_ENABLE_PIN_MEMORY=${VLLM_WSL2_ENABLE_PIN_MEMORY:-1}
    ports:
      # Loopback only — vLLM is reached by the backend container
      # on the compose network, never from the host directly.
      # SECURITY.md H12: same pattern as db / redis.
      - "127.0.0.1:8000:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # /v1/models returns the list of loaded models — cheapest
      # "server is up AND at least one model is loaded" probe.
      # curl is in the vllm image; older revisions had only wget.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      # Total budget = start_period (600s) + retries × interval = 600s +
      # 600s = 1200s = 20 min. vLLM v0.29.0's V2 Model Runner captures
      # cudagraphs for sizes up to 512 on first run — ~10-15 min cold
      # on Blackwell + WSL2 GPU-PV because each capture round-trips
      # through the DXGI shim. Subsequent restarts are faster (weights
      # cached in the vllm_cache volume; only cudagraph capture
      # repeats). Operators who want sub-minute cold starts at the cost
      # of throughput can add `--enforce-eager` to the command list.
      retries: 60
      start_period: 600s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp

volumes:
  db_data:
  vllm_cache:
