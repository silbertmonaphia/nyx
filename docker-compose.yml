version: '3.8'

services:
  db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # OpenTelemetry tracing — Jaeger v1.62+ ingests OTLP/HTTP directly
  # (no sidecar collector needed). COLLECTOR_OTLP_ENABLED turns the
  # OTLP receiver on; the default UI lives on :16686 and the OTLP
  # HTTP receiver on :4318. healthcheck uses the admin port (14269)
  # so backend can wait for it via depends_on.
  jaeger:
    image: jaegertracing/all-in-one:1.62
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/status"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
    ports:
      - "8080:8080"
    # env_file makes .env loading independent of the shell's CWD —
    # compose always reads the file next to this compose file.
    env_file:
      - .env
    environment:
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - CACHE_TTL=${CACHE_TTL:-5m}
      - JWT_SECRET=${JWT_SECRET}
      # OpenTelemetry — on by default in compose so spans flow into
      # the local Jaeger UI without extra env-var setup. Override
      # OTEL_ENABLED=false in .env to disable.
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-nyx-backend}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8080/api
        # OpenTelemetry — the frontend Dockerfile bakes VITE_OTEL_ENABLED
        # and VITE_OTEL_SERVICE_NAME into the bundle at build time.
        # JAEGER_HOST is read at runtime by nginx to proxy /otlp/ to the
        # Jaeger OTLP/HTTP receiver (same-origin, no CORS).
        - VITE_OTEL_ENABLED=${VITE_OTEL_ENABLED:-true}
        - VITE_OTEL_SERVICE_NAME=${VITE_OTEL_SERVICE_NAME:-nyx-frontend}
    environment:
      - VITE_OTEL_ENABLED=${VITE_OTEL_ENABLED:-true}
      - VITE_OTEL_SERVICE_NAME=${VITE_OTEL_SERVICE_NAME:-nyx-frontend}
      - JAEGER_HOST=jaeger
    # nginx runs as non-root (USER nginx in Dockerfile) so it can't bind
    # privileged port 80. The nginx.conf inside the container listens on 8080.
    ports:
      - "5173:8080"
    depends_on:
      - backend
      - jaeger

volumes:
  db_data: