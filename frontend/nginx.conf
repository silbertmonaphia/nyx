server {
    listen 8080;
    server_name localhost;

    # Security headers applied to every response nginx sends to the
    # client, including the proxied /otlp/ response (the upstream's
    # own headers win when present; this is the safety net).
    # SECURITY.md H6.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    # HSTS: 1 year, include subdomains. Browsers ignore this header on
    # plain-HTTP responses (RFC 6797 §7.2) so it's safe to emit always.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy. Notes on the individual directives:
    #   - script-src 'self': Vite emits hashed bundle files, no inline
    #     scripts in production. React's CSR runtime ships in those
    #     bundles — no 'unsafe-inline' needed.
    #   - style-src 'self' 'unsafe-inline': the only inline style is
    #     the FOUC-prevention block in index.html, which is static
    #     markup with no user input. 'unsafe-inline' for style-src is
    #     a far smaller risk than for script-src; switching to a hash
    #     or nonce is brittle and not warranted here.
    #   - img-src 'self' data:: no remote posters today; data: covers
    #     SVG icons and Lucide inlines if any sneak in.
    #   - connect-src 'self' __API_ORIGIN__: the OTel exporter posts
    #     to /otlp/* via the same nginx instance (same-origin), and
    #     axios hits the backend at __API_ORIGIN__ (cross-origin in
    #     production — Bearer requires this for the CORS preflight).
    #   - frame-ancestors 'none': replaces X-Frame-Options (modern
    #     UAs prefer CSP for this; X-Frame-Options remains as a
    #     belt-and-suspenders fallback for older browsers).
    #   - base-uri 'self' / form-action 'self': defence in depth
    #     against <base> hijacking and form-based exfiltration.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # OTLP/HTTP trace export from the SPA. `__JAEGER_HOST__` is
    # substituted at image-build time (Dockerfile ARG JAEGER_HOST).
    # Same-origin: the browser POSTs to /otlp/v1/traces and nginx
    # proxies to Jaeger. Avoids cross-origin CORS for OTel — the
    # backend serves a cross-origin Bearer XHR but the OTLP POST
    # stays same-origin.
    #
    # Variable form + resolver: nginx tries to resolve the upstream
    # hostname at config-parse time when proxy_pass uses a literal
    # host (`proxy_pass http://jaeger:4318/`). Inside the image build
    # context there's no DNS for compose service names, so `nginx -t`
    # (the build-time guardrail in the Dockerfile) fails with
    # "host not found in upstream". The `resolver` directive defers
    # name resolution to request time, against the compose network's
    # embedded DNS at 127.0.0.11.
    #
    # `rewrite ^/otlp/(.*)$ /$1 break` strips the /otlp/ prefix so
    # Jaeger's OTLP receiver sees POST /v1/traces (the path it
    # routes), not POST /otlp/v1/traces. The `break` flag is required,
    # not defensive: the default flag is `last`, which re-enters
    # location matching — the rewritten `/v1/traces` would fall into
    # `location /` and be served as the SPA shell via try_files.
    # `break` keeps the rewrite terminal inside this location.
    location /otlp/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $jaeger_upstream __JAEGER_HOST__:4318;
        rewrite ^/otlp/(.*)$ /$1 break;
        proxy_pass http://$jaeger_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # OTLP/HTTP is JSON POST; do not buffer.
        proxy_request_buffering off;
    }

    # No /api/ proxy block — the SPA now hits the backend at
    # __API_ORIGIN__ directly. Bearer is a plain Authorization
    # header (custom header → CORS preflight → backend's
    # CORS allowlist closes the CSRF surface).

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}