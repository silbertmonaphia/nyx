server {
    listen 8080;
    server_name localhost;

    # Security headers applied to every response nginx sends to the
    # client, including the proxied /api/ and /otlp/ responses (the
    # upstream's own headers win when present; this is the safety net).
    # SECURITY.md H6.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    # HSTS: 1 year, include subdomains. Browsers ignore this header on
    # plain-HTTP responses (RFC 6797 §7.2) so it's safe to emit always.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy. Notes on the individual directives:
    #   - script-src 'self': Vite emits hashed bundle files, no inline
    #     scripts in production. React's CSR runtime ships in those
    #     bundles — no 'unsafe-inline' needed.
    #   - style-src 'self' 'unsafe-inline': the only inline style is
    #     the FOUC-prevention block in index.html, which is static
    #     markup with no user input. 'unsafe-inline' for style-src is
    #     a far smaller risk than for script-src; switching to a hash
    #     or nonce is brittle and not warranted here.
    #   - img-src 'self' data:: no remote posters today; data: covers
    #     SVG icons and Lucide inlines if any sneak in.
    #   - connect-src 'self': the OTel exporter posts to /otlp/* via
    #     the same nginx instance, axios hits /api/* same-origin.
    #   - frame-ancestors 'none': replaces X-Frame-Options (modern
    #     UAs prefer CSP for this; X-Frame-Options remains as a
    #     belt-and-suspenders fallback for older browsers).
    #   - base-uri 'self' / form-action 'self': defence in depth
    #     against <base> hijacking and form-based exfiltration.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # OTLP/HTTP trace export from the SPA. `__JAEGER_HOST__` is
    # substituted at image-build time (Dockerfile ARG JAEGER_HOST).
    location /otlp/ {
        proxy_pass http://__JAEGER_HOST__:4318/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # OTLP/HTTP is JSON POST; do not buffer.
        proxy_request_buffering off;
    }

    # Backend API reverse proxy. `__BACKEND_UPSTREAM__` is
    # substituted at image-build time (Dockerfile ARG BACKEND_UPSTREAM)
    # so dev (compose service name) and prod (k8s service DNS) can
    # each point at the right backend. Same-origin proxy keeps the
    # httpOnly __Host- cookie attributes stable across environments —
    # see FUTURE.md §4 "Persist Auth Token Securely".
    location /api/ {
        proxy_pass http://__BACKEND_UPSTREAM__:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # /api/refresh posts small JSON bodies; default buffering is
        # fine. proxy_request_buffering off mirrors /otlp/ for
        # consistency.
        proxy_request_buffering off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
