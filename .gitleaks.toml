[extend]
useDefault = true

[allowlist]
description = "Reviewed placeholders and fixtures (SECURITY.md): k8s dev/example secret files, the CI e2e JWT fixture, and the foobarbaz-signed JWT in the redaction-test fixture. Singular global form so the entry parses on gitleaks 8.24.3 (the CI binary, which ignores the plural [[allowlists]] at top level); criteria combine with the default OR."
paths = [
  '''^k8s/secrets\.yaml$''',
  '''^k8s/secrets\.yaml\.example$''',
]
regexes = [
  '''ci-secret-0123456789-0123456789-abcdef''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxIn0\.Zm9vYmFyYmF6''',
]
