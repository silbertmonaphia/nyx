apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: nyx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nyx-frontend:latest # Replace with actual image in CD
        ports:
        - containerPort: 8080
        # OpenTelemetry — VITE_* are baked into the bundle at build
        # time; JAEGER_HOST is read at runtime by nginx to proxy /otlp/
        # to the in-cluster Jaeger Service (same-origin, no CORS).
        # BACKEND_UPSTREAM is the nginx /api/ reverse-proxy target —
        # same-origin so __Host- cookies flow correctly (see FUTURE.md
        # §4 "Persist Auth Token Securely").
        env:
        - name: VITE_OTEL_ENABLED
          value: "true"
        - name: VITE_OTEL_SERVICE_NAME
          value: "nyx-frontend"
        - name: JAEGER_HOST
          value: jaeger
        - name: BACKEND_UPSTREAM
          value: backend
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: nyx
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
