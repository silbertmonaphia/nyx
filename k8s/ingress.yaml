apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nyx-app
  namespace: nyx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - app.nyx.com
    - api.nyx.com
    # TODO(operator): provision this Secret via cert-manager + the
    # `letsencrypt-prod` ClusterIssuer. The Ingress above declares
    # the cert-manager annotation; the Secret itself is created out
    # of band and referenced here by name.
    secretName: nyx-tls
  rules:
  # SPA host — serves the React bundle, proxies /otlp/ to Jaeger.
  # No /api/ proxy: the SPA now hits the API host directly via
  # Authorization: Bearer (cross-origin CORS preflight).
  - host: app.nyx.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
  # API host — the only place /api/* is served from. CORS
  # allowlist on the backend narrows who can call cross-origin;
  # the CSRF surface is closed by the custom-header preflight
  # requirement (Bearer is not a CORS-safelisted header).
  - host: api.nyx.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080