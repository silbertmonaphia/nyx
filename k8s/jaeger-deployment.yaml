apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: nyx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        # Jaeger v2 (single OTel Collector binary, image
        # `jaegertracing/jaeger`). Default config enables OTLP
        # receivers (4317 gRPC / 4318 HTTP) and the `healthcheckv2`
        # extension on :13133/status; no extra config needed.
        image: jaegertracing/jaeger:2.18.0
        ports:
        - containerPort: 4317  # OTLP gRPC
        - containerPort: 4318  # OTLP HTTP
        - containerPort: 16686 # UI
        - containerPort: 13133 # healthcheckv2 (/status)
        # NOTE: no persistent volume — Jaeger v2 uses in-memory
        # storage by default. Spans are lost on pod restart. Swap to
        # an external backend (ES/Cassandra/Kafka) if retention matters.
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /status
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /status
            port: 13133
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: nyx
spec:
  selector:
    app: jaeger
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: ui
    port: 16686
    targetPort: 16686
  - name: health
    port: 13133
    targetPort: 13133
  type: ClusterIP
