apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: nyx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        # Jaeger all-in-one: OTLP/HTTP (4318) + OTLP/gRPC (4317) ingest,
        # UI on 16686, admin on 14269. COLLECTOR_OTLP_ENABLED turns the
        # OTLP receiver on.
        image: jaegertracing/all-in-one:1.62
        ports:
        - containerPort: 4317  # OTLP gRPC
        - containerPort: 4318  # OTLP HTTP
        - containerPort: 16686 # UI
        - containerPort: 14269 # admin / health
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        # NOTE: no persistent volume — Jaeger all-in-one uses in-memory
        # storage by default. Spans are lost on pod restart. Swap to an
        # external backend (ES/Cassandra/Kafka) if retention matters.
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: nyx
spec:
  selector:
    app: jaeger
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: ui
    port: 16686
    targetPort: 16686
  - name: admin
    port: 14269
    targetPort: 14269
  type: ClusterIP
