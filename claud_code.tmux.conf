# Claude Code 调优 tmux 配置 —— 价值从高到低:
#   1. status-position top        tmux 栏让出底部,sub-agent 状态带不被挡(原始动机)
#   2. focus-events on            焦点上报,Claude 的通知/提醒依赖它
#   3. escape-time 0              Esc 零延迟(默认 500ms)
#   4. pane-border-status/format  多 pane 不切过去就认出谁在跑什么
#   5. history-limit 100000       回滚缓冲(仅对新建 pane 生效)
#   6. terminal-features RGB      真彩色
#   7. bind y → clip.exe          WSL2 剪贴板
#   8. renumber + base-index      关窗自动重编号,从 1 数起
#
# 放置:~/.tmux.conf 是指向本文件的符号链接(已建好;换机/重建时重建它):
#   ln -sfn /home/smona/nyx/claud_code.tmux.conf ~/.tmux.conf
#
# 生效(不重启 server,立即应用):
#   tmux source-file ~/.tmux.conf
# 注意:conf 只在 tmux server 首次启动时自动读取,改完必须手动 source;
#       history-limit 只影响之后新建的 pane

# 状态栏置顶:底部整块让给 Claude Code 的 sub-agent 状态带
set -g status-position top
# 焦点上报:Claude 感知终端切走/切回,通知与提醒依赖它
set -s focus-events on
# Esc 零延迟(默认 500ms,关弹窗/打断 agent 时可感)
set -s escape-time 0
# 多 pane 各自标题栏:不切过去就认出哪个 Claude 在跑什么
set -g pane-border-status top
set -g pane-border-format ' #{pane_index}: #{pane_title} '
# 回滚缓冲 10 万行(默认 2000;Claude 是重绘型 TUI 刷得快;仅对新建 pane 生效)
set -g history-limit 100000
# 真彩色:Claude 配色不串色
set -sa terminal-features ',*:RGB'
# prefix + y:tmux 缓冲送进 Windows 剪贴板(WSL2)
bind y run-shell "tmux save-buffer - | clip.exe"
# 关窗自动重编号;窗口/pane 从 1 数起(0 键太远)
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
